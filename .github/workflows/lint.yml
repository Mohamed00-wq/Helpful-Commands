name: Lint Markdown

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md"

      - name: Verify README links resolve
        run: |
          set -euo pipefail
          status=0
          for path in $(grep -oE '\]\(([A-Za-z0-9._/-]+\.md)\)' README.md | sed -E 's/.*\((.*)\)/\1/'); do
            if [ ! -f "$path" ]; then
              echo "BROKEN LINK in README.md: $path"
              status=1
            fi
          done
          exit $status
