# markdownlint-cli2 configuration
# https://github.com/DavidAnson/markdownlint-cli2
config:
  MD013:
    # Long ARNs, JMESPath expressions, and flag lists cannot be wrapped, so
    # code blocks and tables are exempt from the line length rule.
    line_length: 100
    code_blocks: false
    tables: false
  MD024:
    # "## Workflows" should appear once per file and "### To create a policy"
    # legitimately repeats across sections, so only siblings must be unique.
    siblings_only: true
  MD033:
    # Inline HTML is not used anywhere in this repository.
    allowed_elements: []
  MD041:
    # The first line of every file is its H1 title.
    level: 1
  MD046:
    style: fenced
  MD048:
    style: backtick
globs:
  - "**/*.md"
ignores:
  - ".git/**"
  - "node_modules/**"
